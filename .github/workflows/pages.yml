name: Deploy Jekyll site to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.4'
          bundler-cache: true
      - uses: actions/configure-pages@v5
        id: configure-pages
      - name: Build site
        run: |
          cat > /tmp/liquid-ruby-compat.rb <<'RUBY'
          class Object
            def tainted? = false
            def untaint = self
            def taint = self
          end
          RUBY
          RUBYOPT=-r/tmp/liquid-ruby-compat.rb bundle exec jekyll build --baseurl "${{ steps.configure-pages.outputs.base_path }}"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
